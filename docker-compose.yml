services:
  app:
    build: ./docker
    # Imagen con nombre compartida con scheduler: si cada servicio construye la suya, una
    # puede quedarse vieja. Pasó en 2026-09: el scheduler se quedó sin pg_dump y db:backup
    # falló a diario durante semanas sin que nadie lo viera.
    image: contratacion-clm-php:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/app
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Ejecuta las tareas de routes/console.php (sincronizaciones diarias y semanales,
  # recálculo de estadísticas, alertas). Sin este servicio nada se lanza solo: los ZIP de
  # PLACSP estuvieron seis meses sin importarse justo por eso, y el portal acabó publicando
  # una caída de contratación que no existía.
  #
  # schedule:work es un proceso en primer plano que despierta cada minuto, así que no hace
  # falta cron dentro del contenedor.
  scheduler:
    build: ./docker
    image: contratacion-clm-php:latest
    volumes:
      - .:/app
    env_file: .env.docker
    restart: unless-stopped
    # Sobrescribe el entrypoint de FrankenPHP: este contenedor no sirve HTTP.
    entrypoint: ["php", "artisan", "schedule:work"]
    # Acotado a 2 GB (el memory_limit de PHP es 1 GB): un import de ZIP grande que se
    # desmadre muere aquí en vez de dejar sin memoria al host, como ya ocurrió una vez.
    mem_limit: 2g
    # La imagen de FrankenPHP trae un healthcheck que consulta el endpoint de métricas de
    # Caddy. Aquí no hay servidor HTTP, así que quedaría "unhealthy" para siempre; si el
    # proceso muere, lo levanta restart: unless-stopped.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    # La contraseña se lee de .env.docker (POSTGRES_PASSWORD); no se versiona en claro.
    env_file: .env.docker
    environment:
      POSTGRES_DB: contratacion
      POSTGRES_USER: contratacion
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 1gb
    restart: unless-stopped
    # Que el OOM killer de la VM de Docker elija a cualquier otro antes que a la BD. El
    # 2026-10-31 mató dos veces el checkpointer en plena carga, con otros proyectos
    # arrancando contenedores en la misma VM. Se recuperó solo, pero no debe repetirse.
    oom_score_adj: -800
    # Tuning para BD de ~25 GB / 8,4M filas en host de 8 GB RAM y 12 CPUs.
    # Sólo parámetros de rendimiento: no altera datos ni esquema.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_worker_processes=12
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - default_statistics_target=200
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_max_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratacion -d contratacion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
